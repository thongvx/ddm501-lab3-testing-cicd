# =============================================================================
# Model Validation
# Re-trains the model with 5-fold CV and enforces the quality gate whenever the
# model, training code or ML dependencies change (and weekly, to catch drift in
# upstream dependencies or data).
# =============================================================================

name: Model Validation

on:
  push:
    paths:
      - 'models/**'
      - 'scripts/**'
      - 'app/model.py'
      - 'requirements.txt'
      - '.github/workflows/model-validation.yml'
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      max_rmse:
        description: 'Maximum hold-out RMSE'
        default: '0.95'
      max_mae:
        description: 'Maximum hold-out MAE'
        default: '0.75'

permissions:
  contents: read

jobs:
  validate-model:
    name: Train & Validate Model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache MovieLens dataset
        uses: actions/cache@v6
        with:
          path: ~/.surprise_data
          key: movielens-100k-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model (5-fold CV + hold-out)
        run: python scripts/train_model.py | tee training.log

      - name: Validate model performance
        run: |
          python scripts/validate_model.py \
            --max-rmse "${{ inputs.max_rmse || '0.95' }}" \
            --max-mae "${{ inputs.max_mae || '0.75' }}"

      - name: Publish metrics
        if: always()
        run: |
          echo "## Model metrics" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat models/metrics.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "Mean RMSE|Hold-out" training.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload model artifact
        uses: actions/upload-artifact@v7
        with:
          name: svd-model-${{ github.sha }}
          path: |
            models/svd_model.pkl
            models/metrics.json
            training.log
          retention-days: 14
