# =============================================================================
# CD Pipeline for Movie Rating API
# DDM501 - Lab 3: Testing & CI/CD
#
# Trigger: version tag (v1.0.0, v1.2.3, ...)
#
#   ci (full CI, reused) ─> build-and-push (GHCR [+ Docker Hub]) ─> deploy-staging
#       (pull + smoke test) ─> release (GitHub Release) ─> deploy-production
#
# Rollback: every release is an immutable image tag (vX.Y.Z and sha-<commit>);
# re-deploying the previous tag (or re-running its CD run) restores it.
# =============================================================================

name: CD Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/movie-rating-api

jobs:
  # ===========================================================================
  # Gate: the exact CI pipeline must pass for the tagged commit
  # ===========================================================================
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ===========================================================================
  # Build and push Docker image
  # ===========================================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: also push to Docker Hub when the secrets are configured
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/movie-rating-api', env.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Deploy to staging: run the pushed image and smoke-test it
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: staging
    permissions:
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy image (by digest) to staging
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}"
          echo "Deploying $IMAGE"
          docker run -d -p 8000:8000 --name staging-api "$IMAGE"

      - name: Smoke tests
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 2; done
          echo
          curl -fsS http://localhost:8000/health | grep -q '"status":"healthy"'
          curl -fsS -X POST http://localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"user_id": "196", "movie_id": "242"}'
          echo
          curl -fsS -X POST http://localhost:8000/predict/batch -H 'Content-Type: application/json' \
            -d '{"predictions": [{"user_id": "196", "movie_id": "242"}, {"user_id": "22", "movie_id": "377"}]}'
          echo
          curl -fsS http://localhost:8000/model/info

      - name: Tear down
        if: always()
        run: docker rm -f staging-api || true

  # ===========================================================================
  # GitHub Release with auto-generated notes
  # ===========================================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Automated release for version ${{ github.ref_name }}.

            **Docker image**
            ```
            docker pull ${{ needs.build-and-push.outputs.image }}:${{ github.ref_name }}
            ```
            Digest: `${{ needs.build-and-push.outputs.digest }}`

            All CI checks (lint, type check, tests with coverage gate, Docker smoke test)
            and staging smoke tests passed for this commit.

  # ===========================================================================
  # Deploy to production (protected environment: add required reviewers in
  # Settings > Environments > production to make this a manual approval)
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, release]
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - name: Deploy to production
        run: |
          echo "Promoting ${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}"
          echo "In a real system this step updates the production service, e.g.:"
          echo "  kubectl set image deployment/movie-rating-api api=<image>@<digest>"
          echo "Rollback: redeploy the previous tag's digest."
